<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img"
     aria-labelledby="ttl desc">
<title id="ttl">통합 현황판 해부도 — 어느 글자를 누가 쓰나</title>
<desc id="desc">보드 화면을 회색 막대 와이어프레임으로 그리고, 각 글자 자리의 출처를 세 가지 색(파랑=config, 초록=data, 주황=엔진 계산)으로 표시한 그림.</desc>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans",sans-serif;fill:#4a555d}
  .h1{font-size:16.5px;font-weight:700;fill:#1d2a32}
  .lead{font-size:11.5px;fill:#5c666e}
  .h2{font-size:12.5px;font-weight:700;fill:#1d2a32}
  .t{font-size:11.5px}
  .tb{font-size:11.5px;font-weight:700;fill:#28323a}
  .ts{font-size:10px;fill:#7d878e}
  .tn{font-size:10.5px;fill:#6b7780}
  .cap{font-size:9.5px;fill:#98a2a8;letter-spacing:.08em}
  .pn{font-size:10.5px;font-weight:700;text-anchor:middle}
  .bar{fill:#cbd1d5}.bar2{fill:#dfe3e6}.bar3{fill:#e9ecee}
  .box{fill:#fff;stroke:#d6dbde}.boxq{fill:#fcfcfb;stroke:#e3e7e9}
  .chip{fill:#edefef;stroke:#dfe3e6}
  .cfg{fill:#2f6ad0}.dat{fill:#12905d}.eng{fill:#d9761a}
  .pin{fill:#fff;stroke-width:2}
  .pcfg{stroke:#2f6ad0}.pdat{stroke:#12905d}.peng{stroke:#d9761a}
</style>

<rect width="1000" height="780" fill="#f7f6f3"/>

<!-- ── 제목과 이 그림의 주장 ───────────────────────────────── -->
<text class="h1" x="20" y="28">통합 현황판 해부도 — 어느 글자를 누가 쓰나</text>
<text class="lead" x="20" y="48">보드는 자기 밴드 이름은 화면에 인쇄한다. 그러나 어느 글자가 내 config에서 왔고 어느 숫자를 엔진이 계산했는지는 인쇄하지 않는다.</text>

