<!-- ── 오른쪽 · 읽는 법 ────────────────────────────────────── -->
<text class="h2" x="636" y="86">색 = 그 글자가 어디서 왔나</text>

<rect x="636" y="100" width="14" height="14" rx="3" fill="#2f6ad0"/>
<text class="tb" x="660" y="107">파랑 · config에 적는다</text>
<text class="ts" x="660" y="123">한 번 적으면 계속 재사용된다</text>

<rect x="636" y="134" width="14" height="14" rx="3" fill="#12905d"/>
<text class="tb" x="660" y="141">초록 · data에 적는다</text>
<text class="ts" x="660" y="157">이번 회차의 사실만 매번 적는다</text>

<rect x="636" y="168" width="14" height="14" rx="3" fill="#d9761a"/>
<text class="tb" x="660" y="175">주황 · 엔진이 계산한다</text>
<text class="ts" x="660" y="191">사람은 적을 수 없다. 적으면 거부된다</text>

<rect x="636" y="204" width="344" height="46" rx="5" fill="#fbf6ed" stroke="#e6d8bd"/>
<text class="tn" x="648" y="223">이 세 색은 상태가 아니라 &#39;출처&#39;다.</text>
<text class="tn" x="648" y="239">보드 화면의 빨강·주황(위험·주의)과는 무관하다.</text>

<text class="h2" x="636" y="280">번호가 가리키는 자리</text>
<g class="pin pcfg"><circle cx="646" cy="300" r="9"/></g><text class="pn" x="646" y="304" fill="#2f6ad0">1</text>
<text class="t" x="666" y="304">카드 제목과 뜻·걸리면</text>
<g class="pin peng"><circle cx="646" cy="330" r="9"/></g><text class="pn" x="646" y="334" fill="#d9761a">2</text>
<text class="t" x="666" y="334">카드 안 굵은 숫자 문장</text>
<g class="pin peng"><circle cx="646" cy="360" r="9"/></g><text class="pn" x="646" y="364" fill="#d9761a">3</text>
<text class="t" x="666" y="364">판정 램프와 결정 필요 건수</text>
<g class="pin pcfg"><circle cx="646" cy="390" r="9"/></g><text class="pn" x="646" y="394" fill="#2f6ad0">4</text>
<text class="t" x="666" y="394">칸반 열 이름</text>
<g class="pin pdat"><circle cx="646" cy="420" r="9"/></g><text class="pn" x="646" y="424" fill="#12905d">5</text>
<text class="t" x="666" y="424">작업 카드의 id·제목·팀</text>
<g class="pin pdat"><circle cx="646" cy="450" r="9"/></g><text class="pn" x="646" y="454" fill="#12905d">6</text>
<text class="t" x="666" y="454">간트 막대의 날짜와 진척</text>
<g class="pin peng"><circle cx="646" cy="480" r="9"/></g><text class="pn" x="646" y="484" fill="#d9761a">7</text>
<text class="t" x="666" y="484">자동 검사의 상태 배지</text>
<g class="pin pcfg"><circle cx="646" cy="510" r="9"/></g><text class="pn" x="646" y="514" fill="#2f6ad0">8</text>
<text class="t" x="666" y="514">맨 아래 한계 고백</text>

<rect x="636" y="536" width="344" height="102" rx="5" fill="#fdf4e9" stroke="#ecc99e"/>
<rect x="636" y="536" width="4" height="102" fill="#d9761a"/>
<text class="ts" x="654" y="559" fill="#8a6a2f">7번 배지를 읽는 법</text>
<text x="654" y="582" font-size="13px" font-weight="700" fill="#6b4a12">초록은 돌려 봤고 괜찮았다,</text>
<text x="654" y="602" font-size="13px" font-weight="700" fill="#6b4a12">회색은 아직 모른다</text>
<text class="ts" x="654" y="624" fill="#8a6a2f">여기의 초록·회색은 배지 색이다. 왼쪽 출처 색과 다르다.</text>

<text class="tn" x="636" y="670">회색 막대는 실제 글자가 들어가는 자리다.</text>
<text class="tn" x="636" y="688">그 글자는 보드 화면에 이미 인쇄돼 있으므로,</text>
<text class="tn" x="636" y="706">이 그림은 글자 대신 출처만 말한다.</text>
<text class="cap" x="636" y="738">REFERENCE/BOARD-SCHEMA.MD</text>
</svg>
